# Builds this LibrePods fork (extra stem actions: open an app and play) and publishes the
# APK as a GitHub release of this repository, so it can be downloaded straight from a phone.
#
# Signing: add one repository secret, CUSTOM_SIGNING_PASSPHRASE (12+ characters). The signing
# key is derived from it on every build (.github/scripts/signing_key.py), so new builds install
# over old ones; nothing key-related is stored in the repository. Without the secret each build
# gets a throwaway key (uninstall before installing).

name: Build custom APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/long-press-launch-app
    paths:
      - 'android/**'
      - '.github/workflows/custom-apk.yml'
      - '.github/scripts/**'

permissions:
  contents: write

concurrency:
  group: custom-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" -Dkotlin.daemon.jvm.options="-Xmx3g"'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK and CMake
        id: sdk
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;30.0.14904198" "cmake;3.22.1"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Prepare signing key
        id: signing
        env:
          PASSPHRASE: ${{ secrets.CUSTOM_SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "::warning::CUSTOM_SIGNING_PASSPHRASE is not set, using a throwaway key. Uninstall the previous build before installing this one."
          fi
          python3 -m pip install --quiet "cryptography>=44"
          python3 .github/scripts/signing_key.py

      - name: Build release APK
        id: build
        working-directory: android
        run: |
          set -o pipefail
          # Shown in the app (Settings > About > Custom build); matches the release tag.
          export CUSTOM_BUILD_LABEL="$(git rev-parse --short HEAD) ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          ./gradlew assembleFossRelease --stacktrace 2>&1 | tee ../build.log

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep -E '^(major|minor|patch)=' android/version.properties | cut -d= -f2 | paste -sd.)
          SHA=$(git rev-parse --short HEAD)
          FILE="LibrePods-custom-v${VERSION}-${SHA}.apk"
          cp android/app/build/outputs/apk/foss/release/app-foss-release.apk "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "tag=custom-v${VERSION}-${SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: librepods-custom-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publish release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.apk.outputs.tag }}
          FILE: ${{ steps.apk.outputs.file }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$FILE" \
            --target "$GITHUB_SHA" \
            --title "LibrePods custom ($TAG): open an app and play from the AirPods stem" \
            --notes "Personal build of LibrePods with extra stem actions (long press or idle double press opens a chosen app and plays). Not an official LibrePods release. Signed with this fork's own key: uninstall the official LibrePods before the first install." \
            --latest

      # Lets the person helping with this fork read build results without Actions API access:
      # the log and step outcomes are force-pushed to the ci-logs branch.
      - name: Publish CI log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOMES: "sdk=${{ steps.sdk.outcome }} signing=${{ steps.signing.outcome }} signing_mode=${{ steps.signing.outputs.mode }} cert_sha256=${{ steps.signing.outputs.fingerprint }} build=${{ steps.build.outcome }} apk=${{ steps.apk.outcome }} release=${{ steps.release.outcome }}"
          TAG: ${{ steps.apk.outputs.tag }}
        run: |
          mkdir -p /tmp/ci-logs
          if [ -f build.log ]; then tail -c 3000000 build.log > /tmp/ci-logs/build.log; else echo "build step did not run" > /tmp/ci-logs/build.log; fi
          {
            echo "job=${{ job.status }}"
            echo "sha=$GITHUB_SHA"
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "tag=$TAG"
            echo "$OUTCOMES"
            date -u
          } > /tmp/ci-logs/STATUS
          cd /tmp/ci-logs
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI log for $GITHUB_SHA (${{ job.status }})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
